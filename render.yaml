# Render Blueprint for the SyncSpace API.
#
# The client is deployed separately (Vercel, see client/vercel.json); this is
# the Express + Hocuspocus + Socket.io server, which is one process serving
# /api/v1, /collab and /socket.io on one port.
#
# Values marked `sync: false` are filled in on Render rather than committed —
# they are credentials or they name the deployment.
services:
  - type: web
    name: syncspace-api
    runtime: node
    plan: free
    region: singapore
    # Workspaces install from the repository root, and the server is a
    # workspace of it. There is no build step: the server runs from source.
    buildCommand: npm ci
    startCommand: npm start --workspace server
    # The same endpoint the app uses to report whether the database is up.
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production

      # Where the database is. A MongoDB Atlas connection string, including
      # the database name.
      - key: MONGODB_URI
        sync: false

      # Signs the session tokens. Generated once by Render and never seen.
      - key: JWT_SECRET
        generateValue: true

      # The deployed client's origin, e.g. https://syncspace.vercel.app.
      # CORS_ORIGIN is what browsers are allowed to call this API from, and it
      # is also checked on the WebSocket handshake; CLIENT_URL is where the
      # links in verification, reset and invitation emails point.
      - key: CORS_ORIGIN
        sync: false
      - key: CLIENT_URL
        sync: false

      # Anyone holding the link to a public room may open it without an
      # account, which is what the landing page's "Start a public room"
      # offers. Production keeps guests out unless this says otherwise, and
      # this deployment says otherwise on purpose. Commenting, files, the
      # copilot and anything that changes who may enter still need an account.
      - key: ALLOW_ANONYMOUS
        value: true

      # Running other people's code, somewhere that is not this service. It has
      # no container runtime, and `auto` would quietly fall back to running
      # programs as ordinary child processes here, which is not a sandbox. So
      # each run gets a microVM of its own on Vercel Sandbox instead: no
      # network, nothing of this server inside it, deleted afterwards.
      #
      # Until the three VERCEL_* values below are set this refuses to run
      # anything, and the Run button says which of them is missing.
      - key: ALLOW_CODE_EXECUTION
        value: true
      - key: SANDBOX_BACKEND
        value: vercel
      # Beside this service, which runs in Singapore: every run is a handful
      # of round trips between the two.
      - key: SANDBOX_REGION
        value: sin1

      # The Vercel account the microVMs run in: an access token with access
      # to the team (the only secret of the three), the team id, and the id
      # of any project in that team — the client's will do, and the sandboxes
      # are listed under it. Free on the Hobby plan up to its monthly
      # allowance, after which Vercel pauses sandbox creation rather than
      # charging, and each run reports that in the console.
      - key: VERCEL_TOKEN
        sync: false
      - key: VERCEL_TEAM_ID
        sync: false
      - key: VERCEL_PROJECT_ID
        sync: false

      # Email. Without a relay the server logs messages instead of sending
      # them, which leaves verification links unreachable — so set these
      # before turning verification on.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: REQUIRE_EMAIL_VERIFICATION
        value: false

      # The copilot and the session summaries. One key decides the provider.
      - key: AI_ENABLED
        value: true
      - key: GOOGLE_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false

      # Uploaded files live on the service's own disk, which on the free plan
      # is wiped on every deploy and restart. Attach a Render disk mounted at
      # /var/data and point UPLOAD_DIR at it to keep them.
      - key: UPLOAD_DIR
        value: ./uploads
