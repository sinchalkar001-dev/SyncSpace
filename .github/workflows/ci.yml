name: CI

# The repository carries several hundred tests and lint across two workspaces.
# Until this file existed none of it ran on a push, so a green history said
# nothing about whether the code worked.

on:
  push:
    branches: [main, feature/frontend]
  pull_request:

# A second push to the same branch makes the first run pointless; stop it
# rather than queue behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client — lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Node 20 rather than the newest release: package.json asks for >=20, and
      # the floor is the version worth proving the code still runs on.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint --workspace client

      - name: Test
        run: npm run test --workspace client

      # Catches what tests cannot: a bad import path, or a chunk that only
      # fails to resolve once Rollup tries to bundle it.
      - name: Build
        run: npm run build

  server:
    name: Server — lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Most of the server suite starts an in-process MongoDB, and
      # mongodb-memory-server downloads a ~100MB mongod the first time. Without
      # this cache every run pays for that download again. The key carries the
      # version pinned in test/helpers/db.js, so bumping it fetches a new one.
      - name: Cache the MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-7.0.14

      - name: Lint
        run: npm run lint --workspace server

      # Slowest step in the workflow by a wide margin, and deliberately last:
      # a lint error should not cost four minutes to find out about.
      - name: Test
        run: npm run test --workspace server

  e2e:
    name: End to end — a real browser against the real stack
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Playwright starts the server itself, against the same in-process
      # MongoDB the unit suite uses, so this job needs that binary too.
      - name: Cache the MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-7.0.14

      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Boots both servers itself (see playwright.config.js) and drives a real
      # browser through the whole app: two tabs syncing a room, drawing,
      # erasing, running code, the dashboard.
      - name: Test
        run: npm run test:e2e

      # A browser failure is close to unreadable without the trace, and the
      # runner is thrown away the moment the job ends.
      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
